name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ZapretBridge ${{ github.ref_name }}"
          body: |
            ### ZapretBridge ${{ github.ref_name }}
            - Добавлена тихая автопроверка обновлений при запуске программы (через ~4 сек после старта и далее раз в 6 часов) с надёжной проверкой через `github.com/releases/latest` (работает даже при блокировках или сбоях `api.github.com`) и резервом на API.
            - При появлении новой версии в боковой панели прямо над строкой **«Интернет: ...»** автоматически появляется компактное уведомление **`Доступно v...`** с кнопкой **«⬇ Скачать и обновить»** (скрыто, когда версия актуальна, и закрывается на крестик до следующего релиза/запуска).
            - При нажатии **«⬇ Скачать и обновить»** прямо в боковой панели отображается живой прогресс-бар (`%`), затем программа останавливает движки (`winws`, `sing-box`, `TG WS Proxy`), обновляет `ZapretBridge.exe` и перезапускается.
          files: |
            ZapretBridge.exe
            ZapretBridge_Setup.exe
