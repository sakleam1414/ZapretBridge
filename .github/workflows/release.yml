name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ZapretBridge ${{ github.ref_name }}"
          body: |
            ### ZapretBridge ${{ github.ref_name }}
            - **Дашборд и DNS-монитор Windows**: проверка работоспособности системного DNS (DnsQuery_W мимо кэша) — если интернет по IP работает, а имена сайтов не открываются, на Дашборде появляется предупреждение с кнопками быстрой смены DoH и сброса DNS-кэша.
            - **Блокировка рекламы (HaGeZi)**: добавлены **Чёрный список** (блокирует домены всегда, приоритетнее белого списка) и инструмент **«Проверить домен»** с показом источника блокировки и разблокировкой/блокировкой в 1 клик.
            - **DNS over HTTPS (DoH)**: кнопка **«Подобрать автоматически»** (выбирает самый быстрый рабочий DoH и запасной сервер), автопереключение на запасной DoH при сбое и опция **«Российские сайты (.ru / .рф) через Яндекс DNS»**.
            - **ПК-диагностика Windows** (раздел «Система»): проверка и включение **TCP Timestamps (RFC 1323)** в 1 клик, детектор конфликтующих процессов (GoodbyeDPI, AdGuard, сторонние VPN) и очистка сетевого кэша Windows.
            - **Удобство обходов**: сохранение отчёта теста стратегий Zapret в .txt, кнопка **«Сменить точку входа»** для туннелей Cloudflare WARP и **«Автовыбор лучшего»** сервера по пингу в VLESS.
          files: |
            ZapretBridge.exe
            ZapretBridge_Setup.exe