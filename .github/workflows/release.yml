name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ZapretBridge ${{ github.ref_name }}"
          body: |
            ### ZapretBridge ${{ github.ref_name }}
            - **Чистый и быстрый установщик (ZapretBridge_Setup.exe)**: убрано скачивание sing-box с GitHub во время установки — инсталлятор больше не зависает на 60% при блокировке GitHub провайдером и ставит программу офлайн за 1–2 секунды.
            - **Аккуратный интерфейс установщика**: убрана лишняя зелёная строка про встроенный Flowseal, а вместо квадрата с буквами ZB в шапке окна отображается фирменная иконка с молнией (pp_icon.ico).
          files: |
            ZapretBridge.exe
            ZapretBridge_Setup.exe