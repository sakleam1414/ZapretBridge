name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ZapretBridge ${{ github.ref_name }}"
          body: |
            ### ZapretBridge ${{ github.ref_name }}
            - Добавлен встроенный DNS-блокировщик рекламы **«Блокировка рекламы»** на базе списков **HaGeZi (wildcard onlydomains)** без нагрузки на файл Windows `hosts`.
            - Выбор уровня строгости в 1 клик (**Light · Multi · Pro · Pro++ · Ultimate**) с 5-сегментным индикатором и 3 опциональными дополнениями (**TIF Mini**, **Телеметрия Windows/Office**, **AdGuard DNS Filter**).
            - Разрешённые DNS-запросы прозрачно перенаправляются через выбранный пользователем зашифрованный **DoH-сервер**; при смене DoH на странице DNS over HTTPS защита рекламы сохраняется на `127.0.0.1`.
            - Встроенный **белый список (исключения)**, живая статистика и журнал последних блокировок с кнопкой **«+ В белый список»** в 1 клик, а также переключатель на Дашборде.
          files: |
            ZapretBridge.exe
            ZapretBridge_Setup.exe
